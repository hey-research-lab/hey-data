name: Snapshot
# Weekly on a schedule (Mondays 02:17 UTC, the full snapshot, attached to a
# GitHub Release), and by hand with the inputs below. The snapshot is uploaded
# as a workflow artifact; with `release` set — always on the schedule — a
# separate job attaches it to a GitHub Release tagged data-<date>-<run id>.
# Snapshots are never committed to the repository.
on:
  schedule:
    # Off the top of the hour, when GitHub's scheduler is least delayed.
    - cron: '17 2 * * 1'
  workflow_dispatch:
    inputs:
      details:
        description: Read each project's dossier and coverage (about two requests per project)
        type: boolean
        default: true
      evidence_limit:
        description: Evidence records to fetch (0 for none)
        type: string
        default: '500'
      resume_from_run:
        description: Run id of a stopped Snapshot run to resume from its partial work (optional)
        type: string
        default: ''
      release:
        description: Attach the finished snapshot to a GitHub Release (data licence CC BY 4.0)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: snapshot
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    permissions:
      contents: read
      # Only to download a stopped run's partial work when resume_from_run is set.
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Validate inputs
        # A scheduled run has no inputs: the defaults a manual run would show stand in.
        env:
          EVIDENCE_LIMIT: ${{ inputs.evidence_limit || '500' }}
          RESUME_FROM_RUN: ${{ inputs.resume_from_run }}
        run: |
          set -euo pipefail
          [[ "$EVIDENCE_LIMIT" =~ ^[0-9]{1,5}$ ]] || { echo "evidence_limit must be a whole number"; exit 2; }
          [[ -z "$RESUME_FROM_RUN" || "$RESUME_FROM_RUN" =~ ^[0-9]{1,20}$ ]] || { echo "resume_from_run must be a run id"; exit 2; }
      - name: Download partial work from the stopped run
        if: inputs.resume_from_run != ''
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: hey-data-partial
          path: snapshot/.work
          run-id: ${{ inputs.resume_from_run }}
          github-token: ${{ github.token }}
      - name: Generate
        env:
          EVIDENCE_LIMIT: ${{ inputs.evidence_limit || '500' }}
          # The schedule reads every dossier and coverage; a manual run says.
          DETAILS: ${{ github.event_name == 'schedule' || inputs.details }}
        run: |
          set -uo pipefail
          # A full run is thousands of requests over hours. Each request rides out a CDN or
          # origin error with exponential backoff (about 12 minutes over 5 retries); if HEY is
          # still unreachable (exit 6) or still rate-limiting (exit 5), the run waits 15 minutes
          # and resumes from its own partial work in snapshot/.work, up to twice. It stopped on
          # one 520 on 2026-10-19 and on two minutes of timeouts and a 503 on 2026-11-02.
          args=(generate --out snapshot --evidence-limit "$EVIDENCE_LIMIT" --max-retries 5)
          if [ "$DETAILS" != "true" ]; then args+=(--no-details); fi
          for attempt in 1 2 3; do
            node dist/bin.js "${args[@]}"
            code=$?
            if [ "$code" -eq 0 ]; then exit 0; fi
            if [ "$code" -ne 5 ] && [ "$code" -ne 6 ]; then exit "$code"; fi
            if [ "$attempt" -eq 3 ]; then exit "$code"; fi
            echo "::warning::HEY did not answer (exit $code); resuming from the partial work in 15 minutes (attempt $((attempt + 1)) of 3)."
            sleep 900
          done
      - name: Keep partial work for a resume
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: hey-data-partial
          path: snapshot/.work
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Copy HEY's hooks file
        # Every Uniswap v4 hook HEY's hooks page shows, from HEY's daily /data snapshot (checksum and allowlist
        # checked). A snapshot that carries no hooks file yet (exit 4) leaves this week without one, with a warning.
        run: |
          set -uo pipefail
          node dist/bin.js hooks --out snapshot
          code=$?
          if [ "$code" -eq 4 ]; then echo "::warning::HEY's newest snapshot has no hooks file; this release carries none."; exit 0; fi
          exit "$code"
      - name: Add the data licence
        run: cp LICENSE-DATA snapshot/LICENSE-DATA
      - name: Upload snapshot
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: hey-data-snapshot-${{ github.run_id }}
          path: |
            snapshot/*.ndjson
            snapshot/metadata.json
            snapshot/hooks.metadata.json
            snapshot/LICENSE-DATA
          if-no-files-found: error
          retention-days: 30

  release:
    needs: snapshot
    # Always on the schedule; by hand only when asked.
    if: github.event_name == 'schedule' || inputs.release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # The only job that can write: it creates the release and its tag.
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: hey-data-snapshot-${{ github.run_id }}
          path: snapshot
      - name: Package and release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          cd snapshot
          generated=$(jq -r '.generatedAt' metadata.json)
          [[ "$generated" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T ]] || { echo "metadata.json has no generatedAt"; exit 1; }
          day=${generated:0:10}
          tag="data-${day}-${RUN_ID}"
          extra=()
          [ -f hooks.metadata.json ] && extra+=(hooks.metadata.json)
          tar -czf "hey-data-${day}.tar.gz" ./*.ndjson metadata.json "${extra[@]}" LICENSE-DATA
          sha256sum ./*.ndjson metadata.json "${extra[@]}" LICENSE-DATA "hey-data-${day}.tar.gz" > SHA256SUMS
          {
            echo "HEY data snapshot generated at ${generated}."
            echo
            echo "Record counts:"
            jq -r '.recordCount | to_entries[] | "- \(.key): \(.value)"' metadata.json
            if [ -f hooks.metadata.json ]; then
              jq -r '"- hooks.ndjson: \(.recordCount) (\(.tied) tied to a project, \(.notTied) not tied), copied from HEY'"'"'s snapshot of \(.day)"' hooks.metadata.json
            fi
            echo
            echo "Data licence: CC BY 4.0. Attribution: HEY Research Lab, https://heyresearch.xyz"
            echo
            jq -r '.disclaimer' metadata.json
            echo
            jq -r '.nonAffiliation' metadata.json
          } > notes.md
          gh release create "$tag" --target "$TARGET_SHA" --title "HEY data snapshot ${day}" \
            --notes-file notes.md \
            ./*.ndjson metadata.json "${extra[@]}" LICENSE-DATA "hey-data-${day}.tar.gz" SHA256SUMS

  alert:
    needs: [snapshot, release]
    # A scheduled snapshot that did not finish opens (or comments on) one issue, so a missed week is seen.
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          title="Weekly snapshot did not finish"
          body="The scheduled snapshot run ${RUN_URL} failed, so no release was cut this week. Its partial work is kept for 7 days as the hey-data-partial artifact: run Snapshot by hand with resume_from_run set to ${RUN_ID} and release on."
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
